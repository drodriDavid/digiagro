<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
body.claro{background:#fff} body.oscuro{background:radial-gradient(ellipse at 50% 45%,#0f5a32 0%,#0b3d24 55%,#062616 100%)}
#escena{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
svg{overflow:visible;display:block}
#lema{margin-top:46px;font:700 34px/1.25 Lato,sans-serif;letter-spacing:.02em;text-align:center;color:#2d2d2d;opacity:0}
body.oscuro #lema{color:#e6f1ea}
#raya{width:0;height:5px;margin-top:40px;background:linear-gradient(90deg,#007336,#8fd400)}
</style></head><body>
<div id="escena"><svg id="logo" viewBox="42 58 4508 886" width="1320" height="259">
<defs>
<linearGradient id="brillo" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cl-dsup"><rect id="r-dsup" x="40" y="50" width="0" height="700"/></clipPath>
<clipPath id="cl-hoja"><rect id="r-hoja" x="40" y="480" width="0" height="460"/></clipPath>
<clipPath id="cl-texto"><rect x="1450" y="240" width="3150" height="490"/></clipPath>
<clipPath id="cl-todo" clip-rule="evenodd"></clipPath>
</defs>
<g id="todo"><g id="simbolo"></g><g id="texto" clip-path="url(#cl-texto)"></g>
<g clip-path="url(#cl-todo)"><rect id="banda" x="-900" y="0" width="700" height="1000" fill="url(#brillo)" transform="skewX(-20)"/></g></g>
</svg><div id="raya"></div><div id="lema">Unidad de Transformación Digital e Inteligencia Artificial del INUO</div></div>
<script>
const P=__PIEZAS__, q=new URLSearchParams(location.search), tema=q.get('tema')||'claro', conLema=q.get('lema')==='1';
document.body.className=tema;
if(!conLema){lema.style.display='none';raya.style.display='none'}
const NS='http://www.w3.org/2000/svg', el={};
const color=f=>tema==='oscuro'&&f==='#083B63'?'#FFFFFF':f;
P.forEach(p=>{const e=document.createElementNS(NS,'path');e.setAttribute('d',p.d);e.setAttribute('fill',color(p.f));e.setAttribute('fill-rule','evenodd');
 (p.n.startsWith('l')?texto:simbolo).append(e);el[p.n]=Object.assign(e,{c:[(p.x0+p.x1)/2,(p.y0+p.y1)/2],b:p});
 const u=document.createElementNS(NS,'path');u.setAttribute('d',p.d);u.setAttribute('clip-rule','evenodd');document.getElementById('cl-todo').append(u);});
el.dsup.setAttribute('clip-path','url(#cl-dsup)');el.hoja.setAttribute('clip-path','url(#cl-hoja)');
const cl=x=>Math.max(0,Math.min(1,x)), seg=(t,a,b)=>cl((t-a)/(b-a));
const oc=x=>1-Math.pow(1-x,3), oq=x=>1-Math.pow(1-x,5), io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const ob=x=>{const c1=1.5,c3=c1+1;return x<=0?0:1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
window.render=t=>{
 // D superior: barrido de izquierda a derecha
 let k=oc(seg(t,.15,.95)); document.getElementById('r-dsup').setAttribute('width',800*k);
 el.dsup.style.opacity=cl(k*3);
 // barra inferior: entra desde la izquierda
 k=oq(seg(t,.45,1.15)); el.dbar.setAttribute('transform',`translate(${-260*(1-k)} 0)`); el.dbar.style.opacity=k;
 // A verde: sube con rebote
 k=seg(t,.7,1.45); const a=ob(k), [cx]=el.a.c;
 el.a.setAttribute('transform',`translate(${cx} ${917}) scale(${.82+.18*a}) translate(${-cx} ${-917}) translate(0 ${170*(1-a)})`); el.a.style.opacity=cl(k*2.5);
 // hoja: crece en barrido
 k=io(seg(t,1.15,1.95)); document.getElementById('r-hoja').setAttribute('width',900*k); el.hoja.style.opacity=cl(k*4);
 // letras: emergen de abajo, escalonadas
 for(let i=0;i<8;i++){const e=el['l'+i];k=oq(seg(t,1.75+i*.085,2.4+i*.085));e.setAttribute('transform',`translate(0 ${520*(1-k)})`);e.style.opacity=cl(k*1.6);}
 // brillo que cruza el logo
 k=io(seg(t,3.05,3.95)); document.getElementById('banda').setAttribute('x',-900+5800*k);
 // ligero acercamiento continuo
 const z=.965+.035*oc(seg(t,0,5.5)); logo.style.transform=`scale(${z})`;
 if(conLema){k=oc(seg(t,2.7,3.5));raya.style.width=(420*k)+'px';k=oc(seg(t,3.0,3.8));lema.style.opacity=k;lema.style.transform=`translateY(${18*(1-k)}px)`;}
};
render(0);
</script></body></html>
