<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=block" rel="stylesheet">
<style>
html,body{margin:0;overflow:hidden;background:transparent}
#escena{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
svg{overflow:visible;display:block}
#lema{text-wrap:balance;font-family:Lato,sans-serif;font-weight:700;letter-spacing:.015em;text-align:center;opacity:0}
#raya{height:0;width:0;background:linear-gradient(90deg,#007336,#8fd400)}
#insti{display:flex;align-items:center;justify-content:center;opacity:0}
#insti img{display:block;width:auto}
.banda{position:absolute;top:-30%;height:160%;transform:skewX(-18deg)}
</style></head><body>
<div id="escena"><svg id="logo" viewBox="42 58 4508 886">
<defs>
<linearGradient id="brillo" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cl-dsup"><rect id="r-dsup" x="40" y="50" width="0" height="700"/></clipPath>
<clipPath id="cl-hoja"><rect id="r-hoja" x="40" y="480" width="0" height="460"/></clipPath>
<clipPath id="cl-texto"><rect x="1450" y="240" width="3150" height="490"/></clipPath>
<clipPath id="cl-todo"></clipPath>
</defs>
<g id="simbolo"></g><g id="texto" clip-path="url(#cl-texto)"></g>
<g clip-path="url(#cl-todo)"><rect id="banda" x="-900" y="0" width="700" height="1000" fill="url(#brillo)" transform="skewX(-20)"/></g>
<rect id="chispa" x="0" y="470" width="14" height="470" rx="7" fill="#c6f24a" opacity="0"/>
</svg><div id="raya"></div><div id="lema">Unidad de Transformación Digital e Inteligencia Artificial del INUO</div>
<div id="insti"><img id="iuja"><img id="iinuo"></div></div>
<div class="banda" id="b1" style="background:#007336"></div><div class="banda" id="b2" style="background:#8fd400"></div>
<script>
const P=__PIEZAS__, q=new URLSearchParams(location.search);
const W=+q.get('w')||1920, H=+q.get('h')||1080, tema=q.get('tema')||'claro', tipo=q.get('tipo')||'intro';
for(const e of [document.documentElement,document.body]){e.style.width=W+'px';e.style.height=H+'px';}
const L=Math.min(W*(W>H?0.6:0.8),1320), u=L/1320, cierre=tipo==='cierre', v=W>H?1.15:(H>W*1.5?1.75:1.5);
logo.setAttribute('width',L);logo.setAttribute('height',L*886/4508);
Object.assign(lema.style,{fontSize:(34*u*v)+'px',lineHeight:'1.3',maxWidth:(W*0.84)+'px',marginTop:(30*u)+'px',color:tema==='oscuro'?'#eef6f0':'#2d2d2d'});
Object.assign(raya.style,{height:(5*u)+'px',marginTop:(40*u)+'px'});
Object.assign(insti.style,{gap:(70*u*v)+'px',marginTop:(70*u*v)+'px'});
iuja.src=tema==='oscuro'?'uja_logo.png':'uja_color.png'; iinuo.src=tema==='oscuro'?'inuo_logo.png':'inuo.svg';
iuja.style.height=Math.min(tema==='oscuro'?120:999,92*u*v)+'px'; iinuo.style.height=Math.min(tema==='oscuro'?112:999,(tema==='oscuro'?88:74)*u*v)+'px';
if(!cierre){lema.style.display=raya.style.display=insti.style.display='none'}
const NS='http://www.w3.org/2000/svg', el={};
const color=f=>tema==='oscuro'&&f==='#083B63'?'#FFFFFF':f;
P.forEach(p=>{const e=document.createElementNS(NS,'path');e.setAttribute('d',p.d);e.setAttribute('fill',color(p.f));e.setAttribute('fill-rule','evenodd');
 (p.n.startsWith('l')?texto:simbolo).append(e);el[p.n]=Object.assign(e,{c:[(p.x0+p.x1)/2,(p.y0+p.y1)/2]});
 const c=document.createElementNS(NS,'path');c.setAttribute('d',p.d);c.setAttribute('clip-rule','evenodd');document.getElementById('cl-todo').append(c);});
el.dsup.setAttribute('clip-path','url(#cl-dsup)');el.hoja.setAttribute('clip-path','url(#cl-hoja)');
const cl=x=>Math.max(0,Math.min(1,x)), seg=(t,a,b)=>cl((t-a)/(b-a));
const oc=x=>1-Math.pow(1-x,3), oq=x=>1-Math.pow(1-x,5), io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, ic=x=>x*x*x;
const ob=x=>{const c1=1.4,c3=c1+1;return x<=0?0:1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const bw=Math.max(W,H)*0.55;[b1,b2].forEach(b=>{b.style.width=bw+'px';b.style.left=(-3*bw)+'px'});
window.render=t=>{
 let k=oc(seg(t,.1,.8)); document.getElementById('r-dsup').setAttribute('width',800*k); el.dsup.style.opacity=cl(k*3);
 k=oq(seg(t,.35,.95)); el.dbar.setAttribute('transform',`translate(${-240*(1-k)} 0)`); el.dbar.style.opacity=k;
 k=seg(t,.55,1.25); const a=ob(k), cx=el.a.c[0];
 el.a.setAttribute('transform',`translate(${cx} 917) scale(${.8+.2*a}) translate(${-cx} -917) translate(0 ${190*(1-a)})`); el.a.style.opacity=cl(k*2.5);
 k=io(seg(t,.95,1.65)); document.getElementById('r-hoja').setAttribute('width',900*k); el.hoja.style.opacity=cl(k*4);
 chispa.setAttribute('x',40+900*k-7); chispa.style.opacity=(k>0&&k<1)?Math.sin(Math.PI*k)*.9:0;
 for(let i=0;i<8;i++){const e=el['l'+i];k=oq(seg(t,1.45+i*.07,2.05+i*.07));e.setAttribute('transform',`translate(0 ${520*(1-k)})`);e.style.opacity=cl(k*1.6);}
 k=io(seg(t,2.45,3.15)); document.getElementById('banda').setAttribute('x',-900+5800*k);
 let z=.955+.045*oc(seg(t,0,3.4)), op=1, blur=0;
 if(!cierre){
   const s=seg(t,3.55,4.15); z*=1+.10*ic(s); op=1-ic(s); blur=10*ic(s)*u;
   const r1=io(seg(t,3.6,4.55)), r2=io(seg(t,3.72,4.75)), span=W+bw*2+H*.8;
   b1.style.left=(-bw-H*.4+span*r1)+'px'; b2.style.left=(-bw-H*.4+span*r2)+'px';
 } else { b1.style.display=b2.style.display='none';
   k=oc(seg(t,2.5,3.3)); raya.style.width=(420*u*k)+'px';
   k=oc(seg(t,2.8,3.6)); lema.style.opacity=k; lema.style.transform=`translateY(${18*u*(1-k)}px)`;
   k=oc(seg(t,3.3,4.1)); insti.style.opacity=k; insti.style.transform=`translateY(${18*u*(1-k)}px)`; }
 logo.style.transform=`scale(${z})`; logo.style.opacity=op; logo.style.filter=blur?`blur(${blur}px)`:'none';
};
render(0);
</script></body></html>
