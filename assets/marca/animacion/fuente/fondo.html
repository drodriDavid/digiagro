<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>
const q=new URLSearchParams(location.search),W=+q.get('w'),H=+q.get('h'),tema=q.get('tema');
c.width=W;c.height=H;const g=c.getContext('2d');
let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
const paso=Math.round(Math.max(W,H)/64),pts=[];
for(let y=paso/2;y<H;y+=paso)for(let x=paso/2;x<W;x+=paso)pts.push([x+(rnd()-.5)*paso*.5,y+(rnd()-.5)*paso*.5,rnd()]);
window.render=t=>{const osc=tema==='oscuro';let gr;
 if(osc){const cx=W*(.5+.08*Math.sin(t*.5)),cy=H*(.42+.05*Math.cos(t*.4));gr=g.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.75);gr.addColorStop(0,'#13693b');gr.addColorStop(.5,'#0b3d24');gr.addColorStop(1,'#05200f');}
 else{gr=g.createRadialGradient(W*.5,H*.45,0,W*.5,H*.45,Math.max(W,H)*.8);gr.addColorStop(0,'#ffffff');gr.addColorStop(.7,'#f6faf3');gr.addColorStop(1,'#e9f3df');}
 g.fillStyle=gr;g.fillRect(0,0,W,H);
 const R=Math.hypot(W,H)/2, frente=R*Math.min(1,t/1.6);
 for(const [x,y,r] of pts){const d=Math.hypot(x-W/2,y-H*.45);if(d>frente)continue;
  const borde=t<1.7?Math.max(0,1-(frente-d)/(R*.18)):0;const base=(osc?.10:.09)*(.5+r*.5)*(1-0.55*d/R);
  g.globalAlpha=Math.min(1,base+borde*(osc?.35:.25));g.fillStyle=osc?'#bfe88a':'#007336';
  const rr=Math.max(1.2,paso*.07)*(1+borde);g.beginPath();g.arc(x,y+Math.sin(t*.8+r*6)*paso*.04,rr,0,7);g.fill();}
 g.globalAlpha=1;};
render(0);</script></body></html>
